[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
remappings = ["vendor/=lib/vendor/", "forge-std/=lib/forge-std/src/"]
solc_version = "0.8.36"
optimizer = true
optimizer_runs = 200
evm_version = "prague"
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
